<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1A5E"/>
      <stop offset="100%" stop-color="#5A2DA6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#F28F3B"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund mit abgerundeten Ecken -->
  <rect x="0" y="0" width="256" height="256" rx="38" fill="url(#bg)"/>

  <!-- Pfeil-Schaft (weiß) -->
  <rect x="112" y="44" width="32" height="90" rx="8" fill="white" opacity="0.95"/>

  <!-- Pfeilspitze nach unten (weiß) -->
  <polygon points="128,178 64,116 192,116" fill="white" opacity="0.95"/>

  <!-- Goldene Import-Ablage (Tray) -->
  <rect x="44" y="192" width="168" height="22" rx="11" fill="url(#accent)"/>
</svg>
